<?xml version="1.0" encoding="UTF-8"?>
<!-- Carrello pixel, griglia 14x12, giallo Pac-Man #FFD43B.
     Manico in alto a sinistra, cesto vuoto, due ruote.
     Nota: nei commenti XML non si possono usare due trattini di fila. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 12" width="14" height="12" shape-rendering="crispEdges" role="img" aria-label="Carrello">
  <g fill="#FFD43B">
    <rect x="0"  y="1"  width="2"  height="1"/>
    <rect x="1"  y="2"  width="1"  height="1"/>
    <rect x="1"  y="3"  width="1"  height="1"/>
    <rect x="2"  y="3"  width="10" height="1"/>
    <rect x="2"  y="4"  width="1"  height="3"/>
    <rect x="11" y="4"  width="1"  height="3"/>
    <rect x="2"  y="7"  width="10" height="1"/>
    <rect x="3"  y="8"  width="1"  height="1"/>
    <rect x="10" y="8"  width="1"  height="1"/>
    <rect x="2"  y="10" width="2"  height="2"/>
    <rect x="8"  y="10" width="2"  height="2"/>
  </g>
</svg>
